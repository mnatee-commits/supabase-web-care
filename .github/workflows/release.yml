name: release

# Publishes a GitHub Release for one version, either when a tag such as v1.17.0 is
# pushed or when the workflow is run by hand on main with that version (the tag is
# then created on the commit being run). The notes are that version's section of
# CHANGELOG.md, so nothing is typed twice.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 1.17.0 (must match webcare/__init__.py)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Work out the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "run this on main"; exit 1; }
            printf '%s' "$INPUT_VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a version: $INPUT_VERSION"; exit 1; }
            echo "TAG=v$INPUT_VERSION" >> "$GITHUB_ENV"
            echo "VERIFY=" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "VERIFY=--verify-tag" >> "$GITHUB_ENV"
          fi
      - name: Check the tag matches the code
        run: |
          version="${TAG#v}"
          grep -qx "__version__ = \"$version\"" webcare/__init__.py || { echo "webcare/__init__.py is not $version"; exit 1; }
          grep -qx "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Take the notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v head="## $version" '$0 == head {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          printf '\nFull history: CHANGELOG.md. What has been verified against a real project: docs/OFFLINE_VM.md.\n' >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $VERIFY
