name: supabase-web-care
description: Read-only checks of a Supabase site's migrations and source (credentials, RLS, function privileges). Contacts no database.
branding:
  icon: shield
  color: green

inputs:
  migrations:
    description: Folder of SQL migrations, read in file-name order
    required: false
    default: supabase/migrations
  repo:
    description: Source tree for the credential scan
    required: false
    default: "."
  baseline:
    description: Baseline file of findings already accepted (optional)
    required: false
    default: ""
  changed-since:
    description: Only look at files changed since this git revision, e.g. origin/main (optional; fetch it first)
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the step (high, medium, low or never)
    required: false
    default: high
  sarif:
    description: Also write webcare-output/report.sarif for code scanning (true or false)
    required: false
    default: "false"
  lang:
    description: Language of report.md (en or th)
    required: false
    default: en

outputs:
  report:
    description: Path of report.md
    value: webcare-output/report.md

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.13"
    - name: Install the toolkit's pinned dependencies
      shell: bash
      run: python -m pip install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/requirements.lock"
    - name: Check
      shell: bash
      # Inputs reach the script only as environment variables and are checked before use,
      # so no input can become part of a shell command.
      env:
        WC_MIGRATIONS: ${{ inputs.migrations }}
        WC_REPO: ${{ inputs.repo }}
        WC_BASELINE: ${{ inputs.baseline }}
        WC_CHANGED_SINCE: ${{ inputs.changed-since }}
        WC_FAIL_ON: ${{ inputs.fail-on }}
        WC_SARIF: ${{ inputs.sarif }}
        WC_LANG: ${{ inputs.lang }}
      run: |
        case "$WC_FAIL_ON" in high|medium|low|never) ;; *) echo "fail-on must be high, medium, low or never"; exit 2;; esac
        case "$WC_LANG" in en|th) ;; *) echo "lang must be en or th"; exit 2;; esac
        case "$WC_SARIF" in true|false) ;; *) echo "sarif must be true or false"; exit 2;; esac
        # Values are joined to their option with "=", so one that starts with "-" stays a value.
        args=(check --skip live --skip probe "--repo=$WC_REPO" "--fail-on=$WC_FAIL_ON" "--lang=$WC_LANG" --out-dir=webcare-output)
        if [ -d "$WC_MIGRATIONS" ]; then
          args+=("--migrations=$WC_MIGRATIONS")
        elif [ "$WC_MIGRATIONS" != "supabase/migrations" ]; then
          # A folder named on purpose but missing would leave the SQL checks out without a word.
          echo "migrations folder not found: $WC_MIGRATIONS"; exit 2
        fi
        if [ -n "$WC_BASELINE" ]; then args+=("--baseline=$WC_BASELINE"); fi
        if [ -n "$WC_CHANGED_SINCE" ]; then args+=("--changed-since=$WC_CHANGED_SINCE"); fi
        if [ "$WC_SARIF" = "true" ]; then args+=(--sarif); fi
        PYTHONPATH="$GITHUB_ACTION_PATH" python -m webcare "${args[@]}"
